name: EduMentor OS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel duplicate runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E,W,F,I --ignore E501 --output-format=github

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required data directories
        run: |
          mkdir -p data/sample_copies data/rubrics data/knowledge_base data/chroma_db

      - name: Generate demo PDF for tests
        run: |
          python -c "
          import sys; sys.path.insert(0, 'demo')
          from _create_sample_pdf import create_sample_pdf
          create_sample_pdf('data/sample_copies/exam_ahmed_benali.pdf')
          print('Demo PDF created')
          "

      - name: Run unit tests (no Groq API required)
        env:
          # Dummy values — unit tests mock all LLM calls
          GROQ_API_KEY: "gsk_test_dummy_key_for_ci"
          LANGCHAIN_TRACING_V2: "false"
          CHROMA_PERSIST_DIR: "./data/chroma_db"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            -k "not integration" \
            --ignore=tests/test_integration.py \
            -x

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: .pytest_cache/
          retention-days: 7

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: edumentor-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

  # ── Security Scan ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true   # non-blocking for now

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true
